name: Documentation
on:
  push:
    branches:
      - main
    tags: '*'

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Clone DataVault.jl and ParamIO.jl (sibling repos)
        run: |
          git clone https://github.com/sotashimozono/DataVault.jl.git $GITHUB_WORKSPACE/../../DataVault.jl
          git clone https://github.com/sotashimozono/ParamIO.jl.git    $GITHUB_WORKSPACE/../../ParamIO.jl

      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
